name: pconnect_mobile
description: Local-network phone controller for Pconnect.
publish_to: "none"

version: 0.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.2.2
  uuid: ^4.4.0
  connectivity_plus: ^7.1.1
  network_info_plus: ^8.1.0
  permission_handler: ^12.0.1
  android_intent_plus: ^6.0.0
  file_picker: ^12.0.0-beta.3
  mobile_scanner: ^7.2.0
  sensors_plus: ^7.0.0
  flutter_local_notifications: ^22.0.0-dev.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
